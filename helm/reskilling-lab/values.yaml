image:
  registry: ""
  tag: latest
  pullPolicy: Always
  publicRegistry: ""

postgres:
  user: capshop
  database: capshop
  password: ""
  maxConnections: 50
  persistence: false
  storage: 2Gi
  storageClass: ""

redis:
  maxMemory: 100mb

jwtSecret: ""

grafana:
  adminUser: admin
  adminPassword: ""

db:
  poolMin: 1
  poolMax: 10

retention:
  prometheus: 15d
  prometheusSize: 4GB
  loki: 168h

isolation:
  networkPolicy:
    enabled: true
    extraIngressNamespaces: []
    allowExternalEgress: false

  resourceQuota:
    enabled: false
    requestsMemory: 3Gi
    limitsMemory: 8Gi
    requestsCpu: "1"
    limitsCpu: "18"
    pods: 30
    pvcs: 4

  limitRange:
    enabled: false
    defaultRequestMemory: 64Mi
    defaultRequestCpu: 10m
    defaultMemory: 256Mi
    defaultCpu: 500m
    maxMemory: 1Gi
    maxCpu: "2"

persistence:
  prometheus:
    enabled: false
    size: 5Gi
  loki:
    enabled: false
    size: 5Gi
  tempo:
    enabled: false
    size: 3Gi
  storageClass: ""

traffic:
  enabled: true
  users: 10
  spawnRate: 1

resources:
  microservice:
    requests: { memory: 80Mi, cpu: 20m }
    limits:   { memory: 256Mi, cpu: 1000m }
  gateway:
    requests: { memory: 96Mi, cpu: 25m }
    limits:   { memory: 384Mi, cpu: 1000m }
  postgres:
    requests: { memory: 96Mi, cpu: 50m }
    limits:   { memory: 512Mi, cpu: 1000m }
  redis:
    requests: { memory: 32Mi, cpu: 10m }
    limits:   { memory: 128Mi, cpu: 500m }
  prometheus:
    requests: { memory: 224Mi, cpu: 50m }
    limits:   { memory: 1Gi, cpu: 1000m }
  loki:
    requests: { memory: 192Mi, cpu: 40m }
    limits:   { memory: 512Mi, cpu: 1000m }
  tempo:
    requests: { memory: 240Mi, cpu: 40m }
    limits:   { memory: 512Mi, cpu: 1000m }
  grafana:
    requests: { memory: 128Mi, cpu: 25m }
    limits:   { memory: 384Mi, cpu: 500m }
  collector:
    requests: { memory: 112Mi, cpu: 25m }
    limits:   { memory: 512Mi, cpu: 1000m }
  small:
    requests: { memory: 24Mi, cpu: 5m }
    limits:   { memory: 128Mi, cpu: 250m }
