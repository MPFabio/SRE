groups:
  - name: slo_alerts
    rules:
      
      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, sum(rate(gateway_request_duration_seconds_bucket{service!="orders"}[5m])) by (le, service)) > 0.5
        for: 2m
        labels:
          severity: warning
          category: slo
        annotations:
          summary: "High P99 latency on {{ $labels.service }}"
          description: "P99 latency is {{ $value | humanizeDuration }} (> 500ms SLO)"

      - alert: HighLatencyP99Orders
        expr: histogram_quantile(0.99, sum(rate(gateway_request_duration_seconds_bucket{service="orders"}[5m])) by (le)) > 1.5
        for: 2m
        labels:
          severity: warning
          category: slo
          service: orders
        annotations:
          summary: "High P99 latency on orders"
          description: "P99 latency is {{ $value | humanizeDuration }} (> 1.5s SLO). Le checkout inclut l'appel au prestataire de paiement, dont la latence simulée va de 100 à 500 ms."

      - alert: CriticalLatencyP99
        expr: histogram_quantile(0.99, sum(rate(gateway_request_duration_seconds_bucket{service!="orders"}[5m])) by (le, service)) > 1.0
        for: 1m
        labels:
          severity: critical
          category: slo
        annotations:
          summary: "Critical P99 latency on {{ $labels.service }}"
          description: "P99 latency is {{ $value | humanizeDuration }} (> 1s threshold)"

      - alert: PaymentServiceHighLatency
        expr: histogram_quantile(0.95, sum(rate(payment_request_duration_seconds_bucket{endpoint="/api/payments"}[5m])) by (le)) > 1
        for: 2m
        labels:
          severity: warning
          category: slo
          service: payment
        annotations:
          summary: "Payment service P95 latency high"
          description: "Payment P95 latency is {{ $value | humanizeDuration }} (> 1s SLO)"

      - alert: HighErrorRate
        expr: sum(rate(gateway_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(gateway_requests_total[5m])) by (service) > 0.01
        for: 2m
        labels:
          severity: warning
          category: slo
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} (> 1% SLO)"

      - alert: CriticalErrorRate
        expr: sum(rate(gateway_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(gateway_requests_total[5m])) by (service) > 0.05
        for: 1m
        labels:
          severity: critical
          category: slo
        annotations:
          summary: "Critical error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} (> 5% threshold)"

      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 1
        for: 0m
        labels:
          severity: critical
          category: resilience
        annotations:
          summary: "Circuit breaker OPEN"
          description: "Payment service circuit breaker is open, blocking requests"

      - alert: CircuitBreakerHalfOpen
        expr: circuit_breaker_state == 2
        for: 0m
        labels:
          severity: warning
          category: resilience
        annotations:
          summary: "Circuit breaker HALF-OPEN"
          description: "Payment service circuit breaker is testing recovery"

      - alert: ErrorBudgetFastBurn
        expr: |
          (
            sum(rate(gateway_requests_total{status=~"5.."}[1h]))
            /
            sum(rate(gateway_requests_total[1h]))
          ) > 14.4 * 0.001
        for: 2m
        labels:
          severity: critical
          category: error_budget
        annotations:
          summary: "Error budget burning fast"
          description: "Error budget is being consumed 14.4x faster than allowed"

      - alert: ErrorBudgetSlowBurn
        expr: |
          (
            sum(rate(gateway_requests_total{status=~"5.."}[6h]))
            /
            sum(rate(gateway_requests_total[6h]))
          ) > 6 * 0.001
        for: 15m
        labels:
          severity: warning
          category: error_budget
        annotations:
          summary: "Error budget burning slowly"
          description: "Error budget is being consumed 6x faster than allowed over 6h window"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been unreachable for more than 1 minute"

      - alert: EndpointDown
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Endpoint {{ $labels.instance }} is down"
          description: "HTTP probe failed for {{ $labels.instance }}"

      - alert: HighRequestRate
        expr: sum(rate(gateway_requests_total[1m])) by (service) > 100
        for: 5m
        labels:
          severity: warning
          category: saturation
        annotations:
          summary: "High request rate on {{ $labels.service }}"
          description: "Request rate is {{ $value }} req/s"

  - name: incident_alerts
    rules:
      - alert: ActiveIncidents
        expr: sum(lab_incidents_triggered_total) - (sum(lab_incidents_resolved_total) or vector(0)) > 0
        for: 0m
        labels:
          severity: info
          category: incident
        annotations:
          summary: "Active simulated incidents"
          description: "There are active incidents being simulated"

      - alert: HighMTTR
        expr: histogram_quantile(0.5, sum(rate(lab_incident_mttr_seconds_bucket[1h])) by (le)) > 1800
        for: 0m
        labels:
          severity: warning
          category: dora
        annotations:
          summary: "High MTTR detected"
          description: "Median time to resolve incidents is {{ $value | humanizeDuration }}"

  - name: database_alerts
    rules:
      - alert: DatabasePoolExhausted
        expr: db_pool_size > 0 and db_pool_idle == 0
        for: 3m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "Pool de connexions saturé sur {{ $labels.job }}"
          description: "Aucune connexion disponible depuis 3 minutes. Voir docs/runbooks/database-saturation.md"

      - alert: DatabaseQueryErrors
        expr: rate(db_query_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          priority: P2
        annotations:
          summary: "Erreurs de requête sur {{ $labels.job }}"
          description: "{{ $value | humanize }} erreur(s)/s sur l'opération {{ $labels.operation }}."

      - alert: DatabaseDown
        # Base arrêtée, l'exporter ne répond plus à temps : pg_up disparaît au lieu de valoir 0.
        expr: pg_up == 0 or up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: "PostgreSQL injoignable"
          description: "L'exporter ne joint plus la base : les services persistants vont échouer."

      - alert: DatabaseConnectionsHigh
        expr: sum(pg_stat_database_numbackends) / on() pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          priority: P2
        annotations:
          summary: "Connexions PostgreSQL au-delà de 80%"
          description: "{{ $value | humanizePercentage }} des connexions serveur sont utilisées."
