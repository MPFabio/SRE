server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: kubernetes-pods
    static_configs:
      - targets: [localhost]
        labels:
          __path__: /var/log/pods/NAMESPACE_PLACEHOLDER_*/*/*.log
    pipeline_stages:
      - cri: {}
      - regex:
          source: filename
          expression: '^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/'
      - labels:
          namespace: namespace
          pod: pod
          job: container
          service: container
      - labeldrop: [filename]
