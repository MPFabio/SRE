apiVersion: v1
kind: Secret
metadata:
  name: lab-secrets
  labels: {{- include "lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.password est obligatoire : --set postgres.password=$(openssl rand -hex 24)" .Values.postgres.password | quote }}
  JWT_SECRET: {{ required "jwtSecret est obligatoire : --set jwtSecret=$(openssl rand -hex 32)" .Values.jwtSecret | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ required "grafana.adminPassword est obligatoire : --set grafana.adminPassword=..." .Values.grafana.adminPassword | quote }}
