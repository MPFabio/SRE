{{- with include "lab.learner" . | fromYaml }}
{{- if .enabled }}
{{- if not .image }}{{ fail "learnerService.image est obligatoire : --set learnerService.image=<registry>/<projet>/<image>:<tag>" }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels: {{- include "lab.labels" $ | nindent 4 }}
spec:
  selector:
    app: {{ .name }}
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels: {{- include "lab.labels" $ | nindent 4 }}
spec:
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        {{- include "lab.labels" $ | nindent 8 }}
    spec:
      {{- with .imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: {{ .name }}
          image: {{ .image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .port }}
          env:
            - name: PORT
              value: {{ .port | quote }}
            - name: SERVICE_NAME
              value: {{ .name }}
            - name: OTEL_SERVICE_NAME
              value: {{ .name }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: otel-collector:4317
            - name: REDIS_URL
              value: redis://redis:6379
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8081
            {{- if .database }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: lab-secrets, key: POSTGRES_PASSWORD }
            - name: DATABASE_URL
              value: {{ include "lab.databaseUrl" $ | quote }}
            {{- end }}
            {{- range $k, $v := .env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ .healthPath }}, port: {{ .port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ .healthPath }}, port: {{ .port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml $.Values.resources.microservice | nindent 12 }}
{{- end }}
{{- end }}
