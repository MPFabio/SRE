{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab
  labels: {{- include "lab.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | default (printf "%s.lab.local" .Release.Namespace) }}
      http:
        paths:
          - path: /ops
            pathType: Prefix
            backend: { service: { name: lab-controller, port: { number: 8090 } } }
          - path: /grafana
            pathType: Prefix
            backend: { service: { name: grafana, port: { number: 3000 } } }
          - path: /prometheus
            pathType: Prefix
            backend: { service: { name: prometheus, port: { number: 9090 } } }
          - path: /alertmanager
            pathType: Prefix
            backend: { service: { name: alertmanager, port: { number: 9093 } } }
          - path: /locust
            pathType: Prefix
            backend: { service: { name: traffic-generator, port: { number: 8089 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: api-gateway, port: { number: 8080 } } }
{{- end }}
