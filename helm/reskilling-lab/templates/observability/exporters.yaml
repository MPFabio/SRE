apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  labels: {{- include "lab.labels" . | nindent 4 }}
spec:
  selector:
    app: postgres-exporter
  ports:
    - port: 9187
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  labels: {{- include "lab.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
        {{- include "lab.labels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.20.1
          ports:
            - containerPort: 9187
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: lab-secrets, key: POSTGRES_PASSWORD }
            - name: DATA_SOURCE_NAME
              value: postgresql://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@postgres:5432/{{ .Values.postgres.database }}?sslmode=disable
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels: {{- include "lab.labels" . | nindent 4 }}
spec:
  selector:
    app: redis-exporter
  ports:
    - port: 9121
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels: {{- include "lab.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
        {{- include "lab.labels" . | nindent 8 }}
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.91.1
          ports:
            - containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: redis://redis:6379
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  labels: {{- include "lab.labels" . | nindent 4 }}
spec:
  selector:
    app: blackbox-exporter
  ports:
    - port: 9115
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  labels: {{- include "lab.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox-exporter
  template:
    metadata:
      labels:
        app: blackbox-exporter
        {{- include "lab.labels" . | nindent 8 }}
    spec:
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.28.0
          args: ["--config.file=/etc/blackbox/blackbox.yml"]
          ports:
            - containerPort: 9115
          volumeMounts:
            - { name: config, mountPath: /etc/blackbox/blackbox.yml, subPath: blackbox.yml }
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
      volumes:
        - { name: config, configMap: { name: blackbox-config } }
