apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  labels: {{- include "lab.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        {{- include "lab.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: promtail
          image: {{ include "lab.publicImage" (list $ "grafana/promtail:3.6.11") }}
          args: ["-config.file=/etc/promtail/config.yml"]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          volumeMounts:
            - { name: config,    mountPath: /etc/promtail/config.yml, subPath: promtail-config.yml }
            - { name: run,       mountPath: /run/promtail }
            - { name: pods,      mountPath: /var/log/pods, readOnly: true }
            - { name: containers, mountPath: /var/lib/docker/containers, readOnly: true }
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
      volumes:
        - { name: config,     configMap: { name: promtail-config } }
        - { name: run,        emptyDir: {} }
        - { name: pods,       hostPath: { path: /var/log/pods } }
        - { name: containers, hostPath: { path: /var/lib/docker/containers } }
