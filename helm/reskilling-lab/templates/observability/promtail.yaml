apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  labels: {{- include "lab.labels" . | nindent 4 }}
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: Role
# metadata:
#   name: promtail
#   labels: {{- include "lab.labels" . | nindent 4 }}
# rules:
#   - apiGroups: [""]
#     resources: ["pods"]
#     verbs: ["get", "list", "watch"]
# ---
# apiVersion: rbac.authorization.k8s.io/v1
# kind: RoleBinding
# metadata:
#   name: promtail
#   labels: {{- include "lab.labels" . | nindent 4 }}
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: Role
#   name: promtail
# subjects:
#   - kind: ServiceAccount
#     name: promtail
#     namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  labels: {{- include "lab.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
        {{- include "lab.labels" . | nindent 8 }}
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:3.6.11
          args: ["-config.file=/etc/promtail/config.yml"]
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          volumeMounts:
            - { name: config,    mountPath: /etc/promtail/config.yml, subPath: promtail-config.yml }
            - { name: run,       mountPath: /run/promtail }
            - { name: pods,      mountPath: /var/log/pods, readOnly: true }
            - { name: containers, mountPath: /var/lib/docker/containers, readOnly: true }
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
      volumes:
        - { name: config,     configMap: { name: promtail-config } }
        - { name: run,        emptyDir: {} }
        - { name: pods,       hostPath: { path: /var/log/pods } }
        - { name: containers, hostPath: { path: /var/lib/docker/containers } }
