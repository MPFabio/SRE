services:
  
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 1.0
    networks:
      - sre-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-capshop}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-capshop-lab-local-dev-only}
      - POSTGRES_DB=${POSTGRES_DB:-capshop}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./observability/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "--max_connections=50"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=${POSTGRES_USER:-capshop} --dbname=${POSTGRES_DB:-capshop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 1.0
    networks:
      - sre-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-capshop}:${POSTGRES_PASSWORD:-capshop-lab-local-dev-only}@postgres:5432/${POSTGRES_DB:-capshop}?sslmode=disable
    depends_on:
      - postgres
    mem_limit: 128m
    cpus: 1.0
    networks:
      - sre-network

  api-gateway:
    build:
      context: ./microservices
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./microservices/api-gateway/static:/app/static:ro
    environment:
      - PORT=8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - CATALOG_SERVICE_URL=http://catalog-service:8081
      - CART_SERVICE_URL=http://cart-service:8082
      - ORDERS_SERVICE_URL=http://orders-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - USERS_SERVICE_URL=http://users-service:8085
      - ENVIRONMENT=development
    depends_on:
      - catalog-service
      - cart-service
      - orders-service
      - payment-service
      - users-service
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 384m
    cpus: 1.0
    networks:
      - sre-network

  catalog-service:
    build:
      context: ./microservices
      dockerfile: catalog-service/Dockerfile
    container_name: catalog-service
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-capshop}:${POSTGRES_PASSWORD:-capshop-lab-local-dev-only}@postgres:5432/${POSTGRES_DB:-capshop}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8081/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpus: 1.0
    networks:
      - sre-network

  cart-service:
    build:
      context: ./microservices
      dockerfile: cart-service/Dockerfile
    container_name: cart-service
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - REDIS_URL=redis://redis:6379
      - CATALOG_SERVICE_URL=http://catalog-service:8081
      - ENVIRONMENT=development
    depends_on:
      - redis
      - catalog-service
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8082/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpus: 1.0
    networks:
      - sre-network

  orders-service:
    build:
      context: ./microservices
      dockerfile: orders-service/Dockerfile
    container_name: orders-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - CART_SERVICE_URL=http://cart-service:8082
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - CATALOG_SERVICE_URL=http://catalog-service:8081
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-capshop}:${POSTGRES_PASSWORD:-capshop-lab-local-dev-only}@postgres:5432/${POSTGRES_DB:-capshop}
    depends_on:
      postgres:
        condition: service_healthy
      cart-service:
        condition: service_started
      payment-service:
        condition: service_started
      catalog-service:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8083/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpus: 1.0
    networks:
      - sre-network

  payment-service:
    build:
      context: ./microservices
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - ENVIRONMENT=development
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8084/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpus: 1.0
    networks:
      - sre-network

  users-service:
    build:
      context: ./microservices
      dockerfile: users-service/Dockerfile
    container_name: users-service
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - JWT_SECRET=${JWT_SECRET:-reskilling-lab-local-dev-only-9f3a7c2e1b}
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-capshop}:${POSTGRES_PASSWORD:-capshop-lab-local-dev-only}@postgres:5432/${POSTGRES_DB:-capshop}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8085/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpus: 1.0
    networks:
      - sre-network

  lab-controller:
    build: ./lab-controller/api
    container_name: lab-controller
    ports:
      - "8090:8090"
    volumes:
      - ./lab-controller/api/static:/app/static:ro
    environment:
      - PORT=8090
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - CATALOG_SERVICE_URL=http://catalog-service:8081
      - CART_SERVICE_URL=http://cart-service:8082
      - ORDERS_SERVICE_URL=http://orders-service:8083
      - USERS_SERVICE_URL=http://users-service:8085
      - DATABASE_URL=postgresql://${POSTGRES_USER:-capshop}:${POSTGRES_PASSWORD:-capshop-lab-local-dev-only}@postgres:5432/${POSTGRES_DB:-capshop}
    depends_on:
      postgres:
        condition: service_healthy
      api-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 256m
    cpus: 1.0
    networks:
      - sre-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "8889:8889"
    depends_on:
      - loki
      - tempo
    mem_limit: 512m
    cpus: 1.0
    networks:
      - sre-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    ports:
      - "9090:9090"
    mem_limit: 1g
    cpus: 1.0
    networks:
      - sre-network

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    mem_limit: 512m
    cpus: 1.0
    networks:
      - sre-network

  promtail:
    image: grafana/promtail:3.6.11
    container_name: promtail
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    mem_limit: 256m
    cpus: 1.0
    networks:
      - sre-network

  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    mem_limit: 512m
    cpus: 1.0
    networks:
      - sre-network

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    mem_limit: 128m
    cpus: 1.0
    networks:
      - sre-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    mem_limit: 512m
    cpus: 1.0
    networks:
      - sre-network

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 128m
    cpus: 1.0
    networks:
      - sre-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    mem_limit: 128m
    cpus: 1.0
    networks:
      - sre-network

  traffic-generator:
    build: ./traffic-generator
    container_name: traffic-generator
    environment:
      - LOCUST_HOST=http://api-gateway:8080
      - LOCUST_USERS=10
      - LOCUST_SPAWN_RATE=1
      - LOCUST_WEB=true
    ports:
      - "8089:8089"
    depends_on:
      - api-gateway
    mem_limit: 256m
    cpus: 1.0
    networks:
      - sre-network

networks:
  sre-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  alertmanager-data:
  grafana-data:
